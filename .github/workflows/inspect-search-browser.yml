name: Inspect rendered search results
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-search-browser.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.56.0 beautifulsoup4==4.14.2
          playwright install --with-deps chromium
      - run: |
          mkdir -p browser-report
          python - <<'PY'
          import json, pathlib, re
          from urllib.parse import urlencode, urljoin
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          base='https://www.peelink2.com'
          report={}
          with sync_playwright() as p:
              browser=p.chromium.launch()
              context=browser.new_context(locale='es-ES')
              page=context.new_page()
              for key,term in [('nemo','Buscando a nemo'),('mufasa','mufasa'),('absent','zzzxqvnonexistent987654')]:
                  try:
                      response=page.goto(base+'/?'+urlencode({'s':term}),wait_until='domcontentloaded',timeout=45000)
                      page.wait_for_timeout(10000)
                      soup=BeautifulSoup(page.content(),'html.parser')
                      links=[]; seen=set()
                      for a in soup.select('a[href]'):
                          url=urljoin(page.url,a.get('href',''))
                          if not re.search(r'/[0-9]{4}/[0-9]{2}/',url) or url in seen: continue
                          seen.add(url)
                          img=a.find('img')
                          title=a.get_text(' ',strip=True) or a.get('title','') or (img.get('alt','') if img else '')
                          parents=[e.name+'.'+'.'.join(e.get('class',[]))+'#'+e.get('id','') for e in list(a.parents)[:5]]
                          links.append({'url':url,'title':title[:180],'parents':parents})
                      relevant=[x for x in links if any(t in (x['url']+' '+x['title']).lower() for t in ['nemo','dory','mufasa'])]
                      report[key]={'status':response.status if response else None,'final_url':page.url,'title':page.title(),'current_selector_count':len(soup.select('.contenedorh .bloque')),'headings':[x.get_text(' ',strip=True)[:180] for x in soup.select('h1,h2,h3')][:30],'dated_link_count':len(links),'relevant_links':relevant[:12],'sample_links':links[:8],'empty_messages':[s for s in soup.stripped_strings if any(t in s.lower() for t in ['no encontrado','sin resultados','no se encontraron','nothing found','not acceptable'])][:6]}
                  except Exception as error: report[key]={'error':str(error)[:400]}
              browser.close()
          pathlib.Path('browser-report/results.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: browser-search-report
          publish_dir: ./browser-report
          enable_jekyll: true
